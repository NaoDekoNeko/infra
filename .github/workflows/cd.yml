name: CD

on:
  push:
    branches: [main]
    paths: ["terraform/**", "k8s/**"]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD_AUTH: "true"

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - run: terraform init
      - run: terraform apply -auto-approve

      - name: Read cert-manager identity client ID
        run: echo "CERT_MANAGER_CLIENT_ID=$(terraform output -raw cert_manager_identity_client_id)" >> "$GITHUB_ENV"

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: AKS credentials
        run: az aks get-credentials --resource-group rg-mibanco-challenge --name aks-mibanco-challenge --admin --overwrite-existing

      - uses: azure/setup-helm@v4
        with:
          version: "v3.16.3"

      - name: Install F5 NGINX Ingress Controller
        run: |
          helm repo add nginx-stable https://helm.nginx.com/stable
          helm repo update
          helm upgrade --install nginx-ingress nginx-stable/nginx-ingress \
            --namespace ingress-nginx --create-namespace \
            --set controller.ingressClass.name=nginx \
            --set controller.service.type=LoadBalancer \
            --wait

      - name: Install cert-manager
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager --create-namespace \
            --set crds.enabled=true \
            --set "serviceAccount.annotations.azure\.workload\.identity/client-id=$CERT_MANAGER_CLIENT_ID" \
            --set-string "podLabels.azure\.workload\.identity/use=true" \
            --wait

      - name: Apply Let's Encrypt ClusterIssuer
        working-directory: .
        env:
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
        run: |
          sed \
            -e "s#CERT_MANAGER_CLIENT_ID_PLACEHOLDER#$CERT_MANAGER_CLIENT_ID#" \
            -e "s#AZURE_SUBSCRIPTION_ID_PLACEHOLDER#$ARM_SUBSCRIPTION_ID#" \
            -e "s#ACME_EMAIL_PLACEHOLDER#$ACME_EMAIL#" \
            k8s/cluster-issuer.yaml | kubectl apply -f -
