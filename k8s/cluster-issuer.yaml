apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ACME_EMAIL_PLACEHOLDER
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - dns01:
          azureDNS:
            subscriptionID: "AZURE_SUBSCRIPTION_ID_PLACEHOLDER"
            resourceGroupName: rg-mibanco-challenge
            hostedZoneName: naodeko.site
            environment: AzurePublicCloud
            managedIdentity:
              clientID: CERT_MANAGER_CLIENT_ID_PLACEHOLDER
